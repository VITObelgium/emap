name: Nix build in dev shell

on: [push]

jobs:
  build:
    name: ${{ matrix.cfg.os }}
    runs-on: ${{ matrix.cfg.os }}
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { os: ubuntu-latest, id: linux }
          - { os: macos-latest, id: mac }

    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v16
        with:
          name: devenv
          extraPullNames: geo-overlay

      - name: Install devenv
        shell: bash
        run: nix profile add nixpkgs#devenv

      - name: Run tests
        run: devenv test
