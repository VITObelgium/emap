name: Release

on:
  push:
    branches: [main, develop]
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
  pull_request:

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux musl (x86_64)
            package: .#packages.x86_64-linux.musl
            artifact: emap-linux-musl
            archive: e-map-Linux-musl.tar.gz
            format: tar
          - name: Windows (x86_64)
            package: .#packages.x86_64-linux.windows
            artifact: emap-windows
            archive: e-map-win64.zip
            format: zip

    steps:
      - name: Clone repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Build package
        run: nix build "${{ matrix.package }}" --out-link result -L

      - name: Create Linux archive
        if: matrix.format == 'tar'
        run: tar --create --gzip --file "${{ matrix.archive }}" --directory result --exclude=nix-support .

      - name: Create Windows archive
        if: matrix.format == 'zip'
        run: |
          cd result
          zip -r "../${{ matrix.archive }}" . -x "nix-support/*"

      - name: Upload release artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Add version to artifact names
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          mv artifacts/emap-linux-musl/e-map-Linux-musl.tar.gz \
            "e-map-${TAG_NAME}-Linux-musl.tar.gz"
          mv artifacts/emap-windows/e-map-win64.zip \
            "e-map-${TAG_NAME}-win64.zip"

      - name: Create release and upload archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "${TAG_NAME}" \
            --title "${TAG_NAME}" \
            --generate-notes \
            --draft=false \
            --prerelease=false \
            "e-map-${TAG_NAME}-Linux-musl.tar.gz" \
            "e-map-${TAG_NAME}-win64.zip"
